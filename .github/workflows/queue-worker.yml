name: Reaction Global Queue Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: reaction-global-queue-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Process global queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "CRON_SECRET dan SITE_URL wajib diatur di GitHub Actions Secrets."
            exit 1
          fi

          for i in 1 2 3 4 5; do
            echo "Queue pass $i/5"
            response="$(curl --fail --silent --show-error --max-time 45               -H "Authorization: Bearer $CRON_SECRET"               -H "Accept: application/json"               -X POST               "$SITE_URL/api/cron/reaction-queue")"
            echo "Queue response: $response"
            sleep 5
          done
